import net.darkhax.curseforgegradle.TaskPublishCurseForge
//2025 copyright some gradle setting from Create : https://github.com/Creators-of-Create/Create

plugins {

    id "net.neoforged.moddev.legacyforge" version "2.0.140"
    id 'net.darkhax.curseforgegradle' version '[1.1.24,)'
    id "dev.ithundxr.silk" version "0.11.15"
    id "me.modmuss50.mod-publish-plugin" version "0.8.3"
    id "idea"
}


apply from: "./gradle/java.gradle"
apply from: "gradle/property_loader.gradle"



group = mod_group_id
version = mod_version
archivesBaseName = mod_id
String gitHash = "${calculateGitHash() + (hasUnstaged() ? "-modified" : "")}"

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}


mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}



repositories {


    mavenCentral()

    maven { url = "https://maven.createmod.net" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
    maven { url = "https://maven.tterrag.com" }
    maven { url = "https://maven.blamejared.com" }

    maven { url = "https://maven.theillusivec4.top/" }
    maven { name = "squiddev"; url = "https://squiddev.cc/maven/" }

    maven {
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        url "https://jitpack.io"
        content { includeGroup "com.github.llamalad7.mixinextras" }
    }
    maven {
        url "https://maven.saps.dev/minecraft"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.ftb.mods"
        }
    }
    maven {
        url "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }

    mavenLocal()
    flatDir { dirs 'libs' }
}




//apply plugin: 'org.spongepowered.mixin'





base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

legacyForge {
    version = "$minecraft_version-$forge_version"
    validateAccessTransformers = false
    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformers.from "src/main/resources/META-INF/accesstransformer.cfg"
    }

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }
    mods {
        "$mod_id" {
            sourceSet sourceSets.main
        }
    }
    runs {
        // applies to all the run configs below
        configureEach {
            systemProperty 'forge.logging.markers', ''
            systemProperty 'forge.logging.console.level', 'info'
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]
            systemProperty 'mixin.debug.export', 'true'
            systemProperty 'mixin.debug.verbose', 'true'
            programArgument '-mixin.config=create.mixins.json'
        }

        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
        }

        data {
            data()
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES,REGISTRYDUMP'
            systemProperty 'forge.logging.console.level', 'debug'
            programArguments.addAll("--mod", mod_id as String, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources").getAbsolutePath())
        }

        gameTestServer {
            type = "gameTestServer"

            gameDirectory = project.file('run/gametest')
        }
    }
}

tasks.withType(Copy).configureEach {
    // 确保这里的配置是正确的
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation 'org.jetbrains:annotations:22.0.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' //Mixin注解处理器(记得开)
    //Create
    modImplementation("curse.maven:create-328085:7178761")
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))


    // 1. 编译时依赖：让代码能引用 MySQL 驱动的类
    implementation "com.mysql:mysql-connector-j:${jdbc_version}"
    // 2. jarJar 打包：将驱动嵌入模组 jar 中（避免类加载隔离）
    jarJar "com.mysql:mysql-connector-j:${jdbc_version}"
    // 3. 运行时类路径：让模组运行/调试时能加载驱动（NeoForged 插件原生支持）
    additionalRuntimeClasspath "com.mysql:mysql-connector-j:${jdbc_version}"
    //modImplementation("curse.maven:lionfish-api-1001614:5922047")

    //observable
    modImplementation("curse.maven:observable-509575:5643037")
    modImplementation("curse.maven:architectury-api-419699:5137938")
    modImplementation("curse.maven:kotlin-for-forge-351264:7291067")

}

processResources {
    def buildProps = project.properties.clone()

    // Replaces FML's magic file.jarVersion string with the correct version at build time.
    buildProps.put('file', [jarVersion: project.version])

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand buildProps
    }
}

compileJava {
    options.compilerArgs = ['-Xdiags:verbose']
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${archivesBaseName}" }

    }
    manifest.attributes([
            "MixinConfigs": "worldprotect.mixins.json",
            "Git-Hash"    :  gitHash
    ])

}

tasks.register('PublishInfo') {
    doLast {
        println "Reobfuscated JAR file path: ${reobfJar.archiveFile.get().asFile.absolutePath}"
        def versionParts = mod_version.split("-")
        println "version = \"$minecraft_version-$mod_version\"\n" +
                "    displayName = \"${display_name}_v${versionParts[0]}_for_Create_v${versionParts[1]}\""
        def propertiesFile = file('api.properties')
        if (propertiesFile.exists()) {
            def properties = new Properties()
            properties.load(new FileInputStream(propertiesFile))
            def cfToken = properties.getProperty("CF_TOKEN")
            def modrinthToken = properties.getProperty("MODRINTH_TOKEN")

            println "CF_TOKEN: $cfToken"
            println "MODRINTH_TOKEN: $modrinthToken"
        } else {
            println "api.properties not exist"
        }
    }
    group = 'Publishing'
}

reobfJar {
    archiveFileName = "${package_name}-${mod_version}-forge-${minecraft_version}.jar"
}



tasks.register('publishAll') {
    dependsOn 'publishCurseForge'
    dependsOn 'publishMods'
    group = 'Publishing'
}









tasks.register('publishCurseForge', TaskPublishCurseForge) {
    dependsOn 'reobfJar'
    def propertiesFile = file('api.properties')
    def properties = new Properties()
    properties.load(new FileInputStream(propertiesFile))

    var cfToken = properties.getProperty("CF_TOKEN")
    apiToken = cfToken
    def versionParts = mod_version.split("-")

    def mainFile = upload(curseforge_id, new File(
            "./build/libs/${package_name}-${mod_version}-forge-${minecraft_version}.jar"))
    mainFile.changelog = new File("./update/${versionParts[0]}-changelog.md").text.split("\n\n\n")[0]
    mainFile.addEnvironment("Client", "Server")
    mainFile.addGameVersion("${minecraft_version}")
    mainFile.addModLoader("Forge","NeoForge")
    mainFile.addRequirement("create")


    mainFile.displayName = "${display_name}_v${versionParts[0]}_for_Create_v${versionParts[1]}"

    mainFile.addOptional(
            "jei",
            "observable")
    mainFile.releaseType = publish_version //beta release. is alpha.
    disableVersionDetection()
}



publishMods {
    def propertiesFile = file('api.properties')
    def properties = new Properties()
    properties.load(new FileInputStream(propertiesFile))
    def modrinthTokenGet = properties.getProperty("MODRINTH_TOKEN")
    def versionParts = mod_version.split("-")

    file = reobfJar.archiveFile
    changelog = rootProject.file("./update/${versionParts[0]}-changelog.md").text
    type = STABLE
    version = "$minecraft_version-$mod_version"
    displayName = "${display_name}_v${versionParts[0]}_for_Create_v${versionParts[1]}"

    modLoaders.add("forge")
    modLoaders.add("neoforge")

    var mrToken = modrinthTokenGet
    if(mrToken != null) {
        modrinth {
            accessToken = mrToken
            projectId = "${modrinth_id}"
            minecraftVersions.add(minecraft_version)
            requires("create")
            optional("jei","observable")
        }
    }
}

String calculateGitHash() {
    try {
        def output = providers.exec {
            commandLine("git", "rev-parse", "HEAD")
        }
        return output.standardOutput.asText.get().trim()
    } catch (Throwable ignored) {
        return "unknown"
    }
}

boolean hasUnstaged() {
    try {
        def output = providers.exec {
            commandLine("git", "status", "--porcelain")
        }
        String result = output.standardOutput.asText.get().replace("/M gradlew(\\.bat)?/", "").trim()
        if (!result.isEmpty())
            println("Found stageable results:\n ${result}\n")
        return !result.isEmpty()
    } catch (Throwable ignored) {
        return false
    }
}

allprojects {
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-encoding', 'utf8']
    }

    tasks.withType(Test) {
        systemProperty "file.encoding", "UTF-8"
    }

    tasks.withType(Javadoc) {
        options.encoding = 'UTF-8'
    }
}


